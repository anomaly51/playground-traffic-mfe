name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, tests, and production build
        run: npm run check

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate standalone image
        run: >-
          docker build --platform linux/amd64
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag playground/traffic-mfe:pr .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: arc-runner-set
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read Harbor credentials from Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-traffic-mfe
          jwtGithubAudience: playground-ci
          exportEnv: false
          secrets: |
            kv/data/ci/playground/traffic-mfe username | HARBOR_USERNAME ;
            kv/data/ci/playground/traffic-mfe password | HARBOR_PASSWORD
      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.internal.api-api-api.com
          username: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault.outputs.HARBOR_PASSWORD }}
      - name: Connect to remote BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://arc-buildkit.arc-runners.svc.cluster.local:1234
      - name: Compute immutable image tag
        id: image
        shell: bash
        run: echo "tag=main-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Check latest main revision
        id: latest
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded main revision."
          fi
      - name: Build and publish
        if: steps.latest.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            harbor.internal.api-api-api.com/playground/traffic-mfe:${{ steps.image.outputs.tag }}
            harbor.internal.api-api-api.com/playground/traffic-mfe:prod
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
