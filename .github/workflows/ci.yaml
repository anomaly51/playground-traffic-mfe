name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, tests, and production build
        run: npm run check

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate standalone image
        run: >-
          docker build --platform linux/amd64
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag playground/traffic-mfe:pr .

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: tests
    outputs:
      published: ${{ steps.latest.outputs.publish }}
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'staging' }}
    runs-on: arc-runner-set
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read Harbor credentials from Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-traffic-mfe
          jwtGithubAudience: playground-ci
          exportEnv: false
          secrets: |
            kv/data/ci/playground/traffic-mfe username | HARBOR_USERNAME ;
            kv/data/ci/playground/traffic-mfe password | HARBOR_PASSWORD
      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.internal.api-api-api.com
          username: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault.outputs.HARBOR_PASSWORD }}
      - name: Connect to remote BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://arc-buildkit.arc-runners.svc.cluster.local:1234
      - name: Compute immutable image tag
        id: image
        shell: bash
        run: |
          printf 'tag=%s-%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Check latest branch revision
        id: latest
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test -n "$latest_sha"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded branch revision."
          fi
      - name: Build and publish
        id: build
        if: steps.latest.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            harbor.internal.api-api-api.com/playground/traffic-mfe:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            io.gitops.source-branch=${{ github.ref_name }}
      - name: Record published image provenance
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_SERVICE: traffic-mfe
          RELEASE_REPOSITORY: harbor.internal.api-api-api.com/playground/traffic-mfe
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          digest = os.environ["RELEASE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("The published image digest is missing or invalid")
          release = {
              "service": os.environ["RELEASE_SERVICE"],
              "repository": os.environ["RELEASE_REPOSITORY"],
              "source_repository": os.environ["RELEASE_SOURCE_REPOSITORY"],
              "source_commit": os.environ["RELEASE_SOURCE_COMMIT"],
              "source_branch": os.environ["RELEASE_SOURCE_BRANCH"],
              "digest": digest,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "release-image.json"
          path.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          print(f"Recorded published image digest: {digest}")
          PY
      - name: Upload published image provenance
        if: steps.latest.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image.json
          if-no-files-found: error
          retention-days: 90

  publish-gitops:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.published == 'true'
    needs: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: anomaly51/general-1-argocd/.github/workflows/publish-playground.yaml@6c75be6a6c2848ac11d56572d8c24d4d2206bb37
    with:
      service: traffic-mfe
